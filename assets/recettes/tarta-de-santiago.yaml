


title: Tarta de Santiago
utensils:
  - saladier
  - fouet
  - moule-rond
  - tamis
recipes:
  Classique:
    ingredients: 
      - label: oeufs 
        qty: 5
        variable: true
      - label: sucre
        qty: 125
        unit: gr
      - label: poudre d'amandes
        qty: 250
        unit: gr
      - label: beurre
        qty: 125
        unit: gr
      - label: cannelle
        qty: 0.5
        unit: cuillère à café
      - label: gingembre
        qty: 0.25
        unit: cuillère à café
      - label: cardamome
        qty: 0.25
        unit: cuillère à café
      - label: zestes de citron
      - label: zestes d'orange
    steps:
      - label: Préparation
        details:
          - Faire fondre le beurre
          - Mélanger les épices, les zestes et la poudre d'amandes
          - Fouetter les oeufs avec le sucre
          - Ajouter le beurre fondu tout en fouettant
          - Incorporer la poudre d'amandes, les épices et les zestes
          - Déverser la préparation dans un moule
      - label: Cuisson
        emoji: 🔥
        details: 
          - Cuire 30 minutes à 160°C
          - Laisser refroidir le gâteau à température ambiante
          - Démouler
          - Saupoudrer de sucre glace (au moment de servir)
