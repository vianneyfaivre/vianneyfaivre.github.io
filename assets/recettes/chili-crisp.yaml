title: Chili Crisp
recipes:
  Classique:
    yield: 1
    yieldType: pot de confiture
    ingredients: 
      - label: cacahuètes
        qty: 20
        unit: gr
      - label: graines de sésame
        qty: 15
        unit: gr
      - label: piment séché
        qty: 15
        unit: gr
      - label: sel 
        qty: 0.5
        unit: cuillère à café
      - label: cardamome
        qty: 3
        unit: cosses
      - label: anis étoilé
        qty: 1
        unit: étoile
      - label: cannelle
        qty: 1
        unit: baton
      - label: laurier
        qty: 1
        unit: feuille
      - label: paprika
        qty: 2
        unit: cuillères à café
      - label: piment d'espelette
        qty: 0.25
        unit: cuillère à café
      - label: poivre de Sichuan
        qty: 5
        unit: gr
      - label: huile de tournesol
        qty: 125
        unit: mL
        variable: true
      - label: oignon rouge
        qty: 1
      - label: gingembre
        qty: 15
        unit: gr
      - label: ail
        qty: 5
        unit: gousses
      - label: huile de sésame
        qty: 3
        unit: cuillères à soupe
    steps:
      - label: Torréfaction et mixage des cacahuètes
        emoji: 🥜
        details:
          - Torréfier les cacahuètes au four une dizaine de minutes à 180°C
          - Laisser refroidir
          - Mixer les cacahuètes avec les graines de sésame, le paprika, le piment d'espelette et le piment séché 
          - Ajouter le sel
      - label: Torréfaction des épices et infusion de l'huile
        emoji: 🌶️
        details: 
          - Préchauffer le wok sur feu fort sans huile
          - Hacher le gingembre 
          - Écraser les cosses de cardamome
          - Déverser la cardamome, l'anis étoilé, la cannelle, le laurier, et le poivre de Sichuan dans le wok
          - Torréfier les épices à sec pendant 5 minutes
          - Déverser le gingembre et l'huile dans le wok
          - Faire infuser 25 minutes sur feu moyen
          - Passer au chinois (conserver l'huile, jeter les épices)
      - label: Cuisson de l'oignon et de l'ail
        emoji: 🔥
        details: 
          - Émincer l'oignon et l'ail
          - Préchauffer le wok sur feu moyen-fort
          - Déverser l'huile infusée dans le wok
          - Faire frire l'oignon et l'ail pendant 10 minutes
      - label: Finalisation
        emoji: 🥃
        details: 
          - Tout déverser dans un saladier
          - Ajouter l'huile de sésame
          - Mélanger
          - Déverser dans le pot à confiture
notes:
  - Se conserve au frais deux mois
  - S'utilise absolument partout