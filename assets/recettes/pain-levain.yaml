title: Pain au Levain
recipes:
  Overnight:
    yield: 1
    yieldType: miche
    options: HYDRATION
    pictures: 8
    ingredients: 
      - label: levain
        qty: 90
        unit: gr
        variable: true
      - label: eau
        qty: 600
        unit: gr
      - label: farine T65
        qty: 900
        unit: gr
      - label: sel
        qty: 16
        unit: gr
    preconditions:
      - Le levain doît être pâteux, bien acide au nez et mûr (le rafraîchir le matin même)
    steps:
      - label: Autolyse (la veille - après-midi vers 17h)
        details:
          - Dans le bol du robot, verser l'eau et la farine
          - Mélanger jusqu'à incorporation
          - Couvrir avec un torchon
      - label: Pétrissage et Pointage (la veille - soir vers 21h)
        details:
          - Dans le bol du robot, verser le levain et le sel
          - Mélanger jusqu'à incorporation
          - Racler les bords
          - Mélanger pendant 4 minutes sur vitesse 2
          - Mélanger pendant 4 minutes sur vitesse 3
          - Faire quelques rabats toutes les 30 minutes (au moins une fois)
          - Couvrir avec un torchon humide
          - Laisser pointer à température ambiante toute la nuit
      - label: Pointage (le lendemain - matin vers 8h)
        details:
          - Faire quelques rabats
          - Laisser pointer à température ambiante 30 minutes
      - label: Façonnage I
        details:
          - Débaquer
          - Faire quelques rabats
          - Façonner (clé vers le bas)
          - Couvrir avec un cul de poule
          - Laisser pointer à température ambiante 30 minutes
      - label: Préparation du banneton
        details:
          - Fariner légèrement le banneton
          - Réserver
      - label: Façonnage II
        details:
          - Retourner le pâton (clé vers le haut)
          - Former un rectangle en aplatissant un peu le pâton
          - Plier horizontalement la moitié du pâton sur lui même (par le bas)
          - Plier horizontalement l'autre moitié du pâton sur lui même (par le haut)
          - Faire pivoter le pâton de 180 degrés
          - Rouler le pâton sur lui même progressivement en partant du bas (style pain au chocolat)
          - Bouler (clé vers le bas)
          - Placer le pâton dans le banneton (clé vers le haut)
      - label: Pointage
        details:
          - Couvrir avec une feuille de papier sulfurisé
          - Couvrir avec un torchon
          - Laisser pointer à température ambiante au moins 1h30
      - label: Préchauffage du four
        details:
          - Placer la cocotte en fonte dans le four
          - Allumer le four à 220 degrés celsius
          - Laisser le four chauffer 20 minutes
      - label: Grignage
        details:
          - Retirer le torchon
          - Placer une planche à découper sur le banneton
          - Retourner
          - Retirer le banneton
          - Asperger d'un peu d'eau
          - Grigner profondément
      - label: Cuisson
        emoji: 🔥
        details:
          - Sortir la cocotte en fonte du four
          - Placer le pâton dans la cocotte
          - Asperger d'un peu d'eau
          - Refermer la cocotte en fonte
          - Placer la cocotte en fonte dans le four
          - Cuire 40 minutes à 220°C 
          - Retirer le couvercle de la cocotte en fonte
          - Cuire 10 minutes à 200°C 
          - Sortir le pain de la cocotte en fonte
          - Laisser ressuer le pain sur grille pendant au moins 1h30
